name: notification-retries

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

env:
  API_BASE_URL: ${{ secrets.API_BASE_URL }}
  INTERNAL_JOB_TOKEN: ${{ secrets.INTERNAL_JOB_TOKEN }}

jobs:
  retry-notifications:
    runs-on: ubuntu-latest
    steps:
      - name: Retry eligible failed email deliveries
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -sS -w '\n%{http_code}' -X POST \
            "$API_BASE_URL/api/v1/internal/notifications/retries" \
            -H "X-Internal-Token: $INTERNAL_JOB_TOKEN")
          http_code=$(tail -n1 <<< "$response")
          body=$(head -n -1 <<< "$response")
          echo "$body"
          if [ "$http_code" -ne 200 ]; then
            echo "::error::notification retry run failed with HTTP $http_code"
            exit 1
          fi
          failed=$(jq -r '.failed // 0' <<< "$body")
          if [ "$failed" -gt 0 ]; then
            echo "::warning::$failed notification delivery attempt(s) failed again"
          fi
